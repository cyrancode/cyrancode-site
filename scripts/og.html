<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Instrument+Sans:wght@500;600&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: #fff; font-family: "Instrument Sans", sans-serif; color: #0a0f1f;
         background-image: radial-gradient(rgba(43,80,255,.12) 1.2px, transparent 1.4px); background-size: 24px 24px; }
  .glow { position: absolute; width: 520px; height: 520px; border-radius: 50%; background: #2b50ff; opacity: .16; filter: blur(110px); left: -160px; top: -180px; }
  .glow2 { position: absolute; width: 460px; height: 460px; border-radius: 50%; background: linear-gradient(120deg,#2b50ff,#a23bff); opacity: .45; filter: blur(70px); right: 60px; top: 90px; }
  .logo { position: absolute; left: 70px; top: 60px; display: flex; align-items: center; gap: 12px; }
  .mark { width: 46px; height: 46px; border-radius: 13px; background: linear-gradient(120deg,#2b50ff,#6b3dff 55%,#a23bff); color: #fff; display: grid; place-items: center; font-family: "JetBrains Mono"; font-weight: 700; font-size: 17px; letter-spacing: -1px; }
  .word { font-family: Sora; font-weight: 800; font-size: 32px; letter-spacing: -1.2px; }
  .word span { color: #2b50ff; }
  .kicker { position: absolute; left: 70px; top: 158px; font-family: "JetBrains Mono"; font-size: 18px; color: #2341e6; background: #edf0ff; border: 1px solid #e2e6f3; padding: 6px 14px; border-radius: 99px; }
  h1 { position: absolute; left: 70px; top: 214px; width: 640px; font-family: Sora; font-weight: 800; font-size: 58px; line-height: 1.08; letter-spacing: -2.4px; }
  h1 em { font-style: normal; background: linear-gradient(120deg,#2b50ff,#6b3dff 55%,#a23bff); -webkit-background-clip: text; color: transparent; }
  .contact { position: absolute; left: 70px; bottom: 60px; display: flex; gap: 14px; font-weight: 600; font-size: 20px; }
  .pill { padding: 10px 16px; border-radius: 12px; background: #c5f82a; color: #0a0f1f; font-weight: 700; }
  .pill.line { background: #fff; border: 1px solid #e2e6f3; }
  .photo { position: absolute; right: 90px; top: 58px; width: 412px; height: 515px; border-radius: 34px; padding: 4px; background: linear-gradient(120deg,#2b50ff,#6b3dff 55%,#a23bff); box-shadow: 0 30px 60px rgba(25,35,90,.18); }
  .photo img { width: 100%; height: 100%; object-fit: cover; border-radius: 30px; display: block; }
</style>
</head>
<body>
  <div class="glow"></div><div class="glow2"></div>
  <div class="logo"><div class="mark">&lt;/&gt;</div><div class="word">cyrancode<span>_</span></div></div>
  <div class="kicker">Développeur logiciel · Douala</div>
  <h1>Applications <em>web, mobiles</em> et sites internet.</h1>
  <div class="contact"><span class="pill">WhatsApp +237 6 72 52 71 20</span><span class="pill line">cyrancode@gmail.com</span></div>
  <div class="photo"><img src="../public/images/cyran-hero.webp" alt=""></div>
</body>
</html>
